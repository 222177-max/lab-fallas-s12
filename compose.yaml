
# Lab S12: 3 réplicas detrás de Nginx + Redis opcional.
# docker compose up -d --build
# Monitor visual: http://localhost:8081

name: lab-fallas

services:
  api:
    build: ./app
    image: lab-fallas:1.0
    expose:
      - "8000"
    environment:
      VERSION: "1.0"
      REDIS_URL: ${REDIS_URL:-}
    restart: ${RESTART:-no}
    deploy:
      replicas: 3

  lb:
    image: nginx:1.30-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./monitor:/usr/share/nginx/html:ro
    depends_on:
      - api

  redis:
    image: redis:7.4-alpine

  # Parte C: monitor independiente en http://localhost:8090
  monitor:
    image: nginx:1.30-alpine
    ports:
      - "8090:80"
    volumes:
      - ./monitor:/usr/share/nginx/html:ro
    profiles:
      - monitor
